name: Compilar Kartali Pagos APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Descomprimir Proyecto
      run: |
        unzip -o kartali-pagos-android.zip

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Generar Gradle Wrapper y Compilar APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Renombrar APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk KartaliPagos.apk

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: KartaliPagos-APK
        path: KartaliPagos.apk

    - name: Publicar Release Oficial
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: "Kartali Pagos Terminal v1.0.0"
        body: "Descarga oficial de Kartali Pagos Terminal para tu Samsung."
        files: KartaliPagos.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

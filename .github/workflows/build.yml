name: Compilar Kartali Pagos APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Descomprimir y Corregir Proyecto
      run: |
        python3 -c "
        import zipfile, os, glob

        with zipfile.ZipFile('kartali-pagos-android.zip', 'r') as z:
            for f in z.filelist:
                clean = f.filename.replace(chr(92), '/')
                target = os.path.join('.', clean)
                if clean.endswith('/'):
                    os.makedirs(target, exist_ok=True)
                else:
                    os.makedirs(os.path.dirname(target), exist_ok=True)
                    with open(target, 'wb') as fp:
                        fp.write(z.read(f))

        for xml_path in glob.glob('app/src/main/res/**/*.xml', recursive=True):
            with open(xml_path, 'r', encoding='utf-8', errors='ignore') as fp:
                raw = fp.read()
            clean_lines = []
            for line in raw.splitlines():
                if '<item' in line and '</item>' not in line and not line.strip().endswith('/>'):
                    if line.strip().endswith('<item>'):
                        idx = line.rfind('<item>')
                        line = line[:idx] + '</item>'
                    elif line.count('<item') > 1:
                        parts = line.split('<item')
                        line = parts[0] + '<item' + parts[1] + '</item>' + '<item'.join(parts[2:])
                    else:
                        line = line.rstrip() + '</item>'
                clean_lines.append(line)
            fixed = chr(10).join(clean_lines)
            if 'themes' in xml_path:
                print('=== BEFORE ' + xml_path + ' ===')
                print(raw)
                print('=== AFTER ' + xml_path + ' ===')
                print(fixed)
            with open(xml_path, 'w', encoding='utf-8') as fp:
                fp.write(fixed)
        "
        ls -la
        ls -la app/src/main/

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generar Gradle Wrapper y Compilar APK
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Renombrar APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk KartaliPagos.apk

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: KartaliPagos-APK
        path: KartaliPagos.apk

    - name: Publicar Release Oficial
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: "Kartali Pagos Terminal v1.0.0"
        body: "Descarga oficial de Kartali Pagos Terminal para tu Samsung."
        files: KartaliPagos.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
